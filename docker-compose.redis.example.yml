# Optional infrastructure profile for a future shared cache/queue deployment.
# It is intentionally not included by docker-compose.yml and never starts by default.
services:
  redis:
    image: redis:7.4-alpine
    profiles: [infra]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - oculix-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true

volumes:
  oculix-redis-data:
